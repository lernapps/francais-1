# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das Verb avoir
description: "Mit avoir sagst du dein Alter und was es gibt: j'ai onze ans, il y a un chat."
competencies: [verb-avoir]
blocks:
  - type: section
    id: einstieg
    title: Worum es geht
    blocks:
      - type: figure
        image: images/szene-avoir.svg
        alt: Léa (links, rote Jacke) und Malik (daneben, blaue Jacke, Brille) stehen in Léas Zimmer. Rechts steht ein Bett, davor sitzt eine Katze, oben rechts ist ein Fenster.
        caption: Léa (links) zeigt Malik (daneben) ihr Zimmer. Es gibt ein Bett, ein Fenster und eine Katze.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: |
          Zum Schluss zeigt Léa Malik ihr Zimmer. Dabei erfahren die beiden, dass sie gleich alt sind, und Malik entdeckt die Katze vom Foto.
          Dafür braucht Léa ein zweites wichtiges Wort neben *être* („sein“): *avoir*, auf Deutsch „haben“.

          **Danach kannst du:** *avoir* mit allen Pronomen verwenden, dein Alter sagen und mit *il y a* sagen, was es irgendwo gibt.
  - type: section
    id: neu
    title: "Neu: So lautet avoir"
    blocks:
      - type: table
        caption: avoir („haben“)
        header: [Pronomen, Form]
        rows:
          - ["j'", "ai"]
          - ["tu", "as"]
          - ["il / elle / on", "a"]
          - ["nous", "avons"]
          - ["vous", "avez"]
          - ["ils / elles", "ont"]
      - type: text
        text: |
          - **Alter:** Im Französischen „hat“ man Jahre. *J'ai onze ans.* heißt wörtlich „Ich habe elf Jahre“, gemeint ist „Ich bin elf Jahre alt“. *ans* heißt „Jahre“. Die Zahlen kennst du von der Seite „Zahlen bis 100“.
          - **Es gibt:** *Il y a un chat.* heißt „Da ist eine Katze“ oder „Es gibt eine Katze“. *il y a* lernst du als Ganzes. *un* heißt „ein“. Weil *chat* männlich ist, steht *un* davor, und *un chat* heißt „eine Katze“. Mehr dazu lernst du später.
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              Für das Alter nimmst du immer *avoir*, nie *être*. *Je suis onze ans* ist falsch. Richtig ist *J'ai onze ans.*
  - type: section
    id: kurz-geuebt
    title: Kurz geübt
    blocks:
      - type: single-choice
        id: alter-sagen
        text: Wie sagst du „Ich bin elf Jahre alt“?
        options:
          - {
              text: "J'ai onze ans.",
              correct: true,
              info: "Richtig: Das Alter sagst du mit avoir: wörtlich „Ich habe elf Jahre“.",
            }
          - {
              text: "Je suis onze ans.",
              correct: false,
              info: "Das ist der typische Fehler: Im Französischen sagt man das Alter nicht mit être („sein“), sondern mit avoir („haben“).",
            }
          - {
              text: "Tu as onze ans.",
              correct: false,
              info: "tu as heißt „du hast“. Hier sprichst du über dich: j'ai.",
            }
          - {
              text: "Nous avons onze ans.",
              correct: false,
              info: "nous avons heißt „wir haben“. Hier sprichst du nur über dich: j'ai.",
            }
        explanation: "Das Alter sagst du mit avoir: J'ai onze ans."
        links:
          - { title: Französische Grammatik (Wikipedia), url: "https://de.wikipedia.org/wiki/Französische_Grammatik" }
  - type: section
    id: nachsprechen
    title: Hören und nachsprechen
    blocks:
      - type: text
        text: |
          Malik sagt *J'ai onze ans.* und *Tu as onze ans.*, Léa sagt *Nous avons onze ans.* und *Il y a un chat.*
          Höre zu, nimm dich selbst auf und vergleiche. Dann bewertest du dich selbst.
      - type: speaking-task
        id: sprechen-ueben
        language: fr
        items:
          - audio: jai-onze-ans.mp3
            text: J'ai onze ans.
          - audio: tu-as-onze-ans.mp3
            text: Tu as onze ans.
          - audio: nous-avons-onze-ans.mp3
            text: Nous avons onze ans.
          - audio: il-y-a-un-chat.mp3
            text: Il y a un chat.
        hint: "Sprich langsam und deutlich. Das Alter sagst du mit den Zahlen von der Seite „Zahlen bis 100“."
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: matching
        id: formen-zuordnen
        text: Welche Form von avoir gehört zu welchem Pronomen?
        pairs:
          - { left: tu, right: as }
          - { left: nous, right: avons }
          - { left: vous, right: avez }
          - { left: ils, right: ont }
          - { left: elle, right: a }
        distractors: [ai]
        explanation: "tu as, nous avons, vous avez, ils ont, elle a. Die Form ai gehört nur zu j'."
        links:
          - { title: Französische Grammatik (Wikipedia), url: "https://de.wikipedia.org/wiki/Französische_Grammatik" }
      - type: language-task
        id: avoir-formen
        languages: { source: de, target: fr }
        mode: table
        task: Schreibe die fehlenden Formen von avoir.
        form: { case: hint }
        table:
          caption: avoir
          header: [Pronomen, Form]
          rows:
            - ["j'", "[ai]"]
            - [tu, "[as]"]
            - [il / elle, "[a]"]
            - [nous, "[avons]"]
            - [vous, "[avez]"]
            - [ils / elles, "[ont]"]
      - type: language-task
        id: avoir-waehlen
        languages: { source: de, target: fr }
        mode: choice
        task: Wähle die passende Form von avoir.
        items:
          - source: Ich bin zwölf Jahre alt.
            target: "J'[ai] douze ans."
            distractors: [[as, suis]]
            mistakes:
              - answer: suis
                message: "Das Alter sagst du mit avoir, nicht mit être: j'ai douze ans."
              - answer: as
                message: "as gehört zu tu („du hast“). Zu j' gehört ai: j'ai."
          - source: Du bist dreizehn Jahre alt.
            target: "Tu [as] treize ans."
            distractors: [[ai, a]]
            mistakes:
              - answer: ai
                message: "ai gehört zu j'. Zu tu gehört as: tu as."
              - answer: a
                message: "a gehört zu il, elle und on. Zu tu gehört as: tu as."
          - source: Ihr seid zehn Jahre alt.
            target: "Vous [avez] dix ans."
            distractors: [[avons, ont]]
            mistakes:
              - answer: avons
                message: "avons gehört zu nous („wir haben“). Zu vous gehört avez: vous avez."
              - answer: ont
                message: "ont gehört zu ils und elles („sie haben“). Zu vous gehört avez: vous avez."
          - source: Zoé ist zehn Jahre alt.
            target: "Zoé [a] dix ans."
            distractors: [[as, ont]]
            mistakes:
              - answer: as
                message: "as gehört zu tu. Zu Zoé (elle) gehört a: Zoé a dix ans."
              - answer: ont
                message: "ont gehört zu mehreren Personen (ils, elles). Zoé ist eine Person: Zoé a."
      - type: language-task
        id: il-y-a-waehlen
        languages: { source: de, target: fr }
        mode: choice
        task: Wähle die passende Wendung.
        items:
          - source: Da ist ein Buch.
            target: "Il [y a] un livre."
            distractors: [[est, a]]
            mistakes:
              - answer: est
                message: "il est heißt „er ist“. Für „da ist“ sagst du il y a."
              - answer: a
                message: "il a heißt „er hat“. Für „da ist“ sagst du il y a."
      - type: generated
        id: alter-raten
        given:
          e: { pick: 1, from: { data: alter } }
        task:
          text: "Ein Kind in Léas Klasse sagt: J'ai {{e.fr}} ans. Wie alt ist das Kind? (Schreibe die Zahl mit Ziffern.)"
        answer: { value: "e.n", compare: { number: { format: integer } } }
        hint: "ans heißt „Jahre“. Welche Zahl steht davor? Die Zahlwörter findest du auf der Seite „Zahlen bis 100“."
        steps:
          - "Suche das Zahlwort: {{e.fr}}."
          - "Das Kind ist {{e.n}} Jahre alt."
      - type: language-task
        id: avoir-hoeren
        languages: { source: de, target: fr }
        task: Höre den Satz und schreibe ihn auf. Du kannst ihn so oft hören, wie du magst.
        form: { case: hint, punctuation: ok }
        items:
          - audio: lea-a-onze-ans.mp3
            target: Léa a onze ans.
            mistakes:
              - answer: (L|l)éa est onze ans(.|)
                message: "Das Alter sagst du mit avoir: Léa a onze ans."
          - audio: ils-ont-onze-ans.mp3
            target: Ils ont onze ans.
            mistakes:
              - answer: (I|i)ls sont onze ans(.|)
                message: "Das Alter sagst du mit avoir: ils ont onze ans."
          - audio: elle-a-un-chat.mp3
            target: Elle a un chat.
            mistakes:
              - answer: (E|e)lle est un chat(.|)
                message: "Hier geht es ums Haben, nicht ums Sein: elle a un chat („sie hat eine Katze“)."
      - type: language-task
        id: avoir-uebersetzen
        languages: { source: de, target: fr }
        task: Schreibe den Satz auf Französisch.
        form: { punctuation: ok }
        items:
          - source: Ich bin dreizehn Jahre alt.
            target: J'ai treize ans.
            mistakes:
              - answer: (J|j)e suis treize ans(.|)
                message: "Das Alter sagst du mit avoir: j'ai treize ans."
              - answer: (J|j)e ai treize ans(.|)
                message: "Vor einem Vokal wird je zu j': j'ai."
          - source: Malik ist elf Jahre alt.
            target: Malik a onze ans.
            mistakes:
              - answer: (M|m)alik est onze ans(.|)
                message: "Das Alter sagst du mit avoir: Malik a onze ans."
          - source: Da ist eine Katze.
            target: Il y a un chat.
          - source: Da ist ein Heft.
            target: Il y a un cahier.
            mistakes:
              - answer: (I|i)l est un cahier(.|)
                message: "il est heißt „er ist“. Für „da ist“ sagst du il y a."
  - type: section
    id: geschafft
    title: Geschafft!
    blocks:
      - type: note
        title: Das kannst du jetzt
        blocks:
          - type: text
            text: |
              Du hast mit Léa und Malik das erste Kapitel geschafft. Das kannst du jetzt:

              - Buchstaben-Teams wie *ou*, *oi*, *eau*, *ch* und *gn* lesen und sprechen,
              - dich begrüßen, vorstellen und verabschieden,
              - bis 100 zählen, auch 70 bis 99,
              - mit *je, tu, il, elle, on, nous, vous, ils* und *elles* sagen, wer etwas tut,
              - mit *être* und *avoir* sagen, wer du bist, wo du bist und wie alt du bist,
              - *le, la, l'* und *les* vor ein Wort setzen.

              Das war das erste Kapitel der App. Du kannst noch einmal von vorn anfangen ([Seite 1](/kapitel-1/laut-und-schrift/)), zur [Startseite](/) gehen oder die Sätze laut mit jemandem durchsprechen.
