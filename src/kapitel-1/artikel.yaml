# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Der bestimmte Artikel
description: Den bestimmten Artikel le, la, l' und les richtig vor ein Nomen setzen.
competencies: [bestimmter-artikel]
blocks:
  - type: section
    id: einstieg
    title: Worum es geht
    blocks:
      - type: figure
        image: images/szene-artikel.svg
        alt: Léa (links, rote Jacke) und Malik (Mitte, blaue Jacke, Brille) stehen an einem Tisch. Auf dem Tisch liegen ein blauer Rucksack, Hefte, ein Buch, ein Stift und ein gelbes Federmäppchen.
        caption: Léa (links) und Malik (Mitte) packen die Schultasche. Auf dem Tisch liegen Heft, Federmäppchen, Buch und Stift.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: |
          Du kennst *le chat* und *la montagne* von der ersten Seite. Das kleine Wort davor ist der **Artikel**: Es gehört zu jedem Nomen.
          Léa und Malik packen die Schultasche und benennen alles, was sie einpacken.

          **Danach kannst du:** den bestimmten Artikel *le*, *la*, *l'* und *les* richtig vor ein Nomen setzen.
  - type: section
    id: neu
    title: "Neu: le, la, l' und les"
    blocks:
      - type: text
        text: |
          Im Deutschen heißt der bestimmte Artikel „der“, „die“ oder „das“. Im Französischen gibt es vier Formen. Welche du brauchst,
          hängt vom Nomen ab.
      - type: table
        caption: Die vier Formen des bestimmten Artikels
        header: [Artikel, Wort, Bedeutung]
        rows:
          - ["le", "le cahier", "das Heft"]
          - ["le", "le stylo", "der Stift"]
          - ["la", "la trousse", "das Federmäppchen"]
          - ["la", "la porte", "die Tür"]
          - ["l'", "l'école", "die Schule"]
          - ["l'", "l'ami", "der Freund"]
          - ["les", "les livres", "die Bücher"]
          - ["les", "les stylos", "die Stifte"]
      - type: text
        text: |
          - **le** steht vor männlichen Nomen, **la** vor weiblichen.
          - **l'** steht statt *le* oder *la* vor einem Vokal (a, e, i, o, u) oder einem stummen h, zum Beispiel *l'école*.
          - **les** steht, wenn es mehrere gibt. Das Nomen bekommt dann meist ein *s*, das man nicht hört: *les livres*.
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              Ob ein Nomen mit *le* oder *la* steht, siehst du ihm nicht an. Lerne darum jedes Nomen gleich mit seinem Artikel, wie auf der ersten Seite.
  - type: section
    id: nachsprechen
    title: Hören und nachsprechen
    blocks:
      - type: text
        text: |
          Zuerst einzelne Wörter: Léa spricht *le cahier*, *l'école* und *le stylo* vor, Malik *la trousse* und *les livres*.
          Höre zu, nimm dich selbst auf und vergleiche. Bewerte danach, wie es klang.
      - type: speaking-task
        id: sprechen-ueben
        language: fr
        items:
          - audio: le-cahier.mp3
            text: le cahier
          - audio: la-trousse.mp3
            text: la trousse
          - audio: lecole.mp3
            text: l'école
          - audio: les-livres.mp3
            text: les livres
          - audio: le-stylo.mp3
            text: le stylo
        hint: "Sprich den Artikel und das Nomen zusammen, ohne Pause dazwischen."
      - type: text
        text: |
          Jetzt zwei kurze Sätze: Léa sagt *Voici le cahier et la trousse.*, Malik sagt *Voici l'école et les livres.*
          Sprich beide Sätze in einem Zug.
      - type: speaking-task
        id: sprechen-satz
        language: fr
        items:
          - audio: voici-le-cahier-et-la-trousse.mp3
            text: Voici le cahier et la trousse.
          - audio: voici-lecole-et-les-livres.mp3
            text: Voici l'école et les livres.
        hint: "Sprich jeden Satz in einem Zug, ohne zwischen den Wörtern abzusetzen."
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: single-choice
        id: artikel-vor-ecole
        text: Welcher Artikel steht vor école?
        options:
          - { text: "l'", correct: true, info: "Richtig: école beginnt mit einem Vokal, darum l'école." }
          - { text: le, correct: false, info: "le steht vor männlichen Nomen. Vor einem Vokal wird daraus l'." }
          - { text: la, correct: false, info: "la steht vor weiblichen Nomen. Vor einem Vokal wird daraus l'." }
          - { text: les, correct: false, info: "les steht bei mehreren. école ist eine einzelne Schule." }
        explanation: "Vor einem Vokal wird le oder la zu l'. Darum l'école."
        links:
          - { title: Französische Grammatik (Wikipedia), url: "https://de.wikipedia.org/wiki/Französische_Grammatik" }
      - type: language-task
        id: artikel-waehlen
        languages: { source: de, target: fr }
        mode: choice
        task: Wähle den passenden Artikel.
        items:
          - source: das Heft
            target: "[Le] cahier"
            distractors: [[La, "L'"]]
          - source: das Federmäppchen
            target: "[La] trousse"
            distractors: [[Le, "L'"]]
          - source: die Schule
            target: "[L']école"
            distractors: [[Le, La]]
          - source: die Bücher
            target: "[Les] livres"
            distractors: [[Le, La]]
          - source: der Stift
            target: "[Le] stylo"
            distractors: [[La, Les]]
      - type: language-task
        id: artikel-hoeren
        languages: { source: de, target: fr }
        task: Höre das Wort mit Artikel und schreibe es auf. Du kannst es so oft hören, wie du magst.
        form: { case: hint, punctuation: ok }
        items:
          - audio: le-cahier.mp3
            target: le cahier
            mistakes:
              - answer: la cahier
                message: "cahier ist männlich: le cahier."
          - audio: la-trousse.mp3
            target: la trousse
            mistakes:
              - answer: le trousse
                message: "trousse ist weiblich: la trousse."
          - audio: lecole.mp3
            target: l'école
            mistakes:
              - answer: le école
                message: "Vor einem Vokal wird le zu l': l'école."
          - audio: les-livres.mp3
            target: les livres
            mistakes:
              - answer: les livre
                message: "Bei mehreren steht das Nomen meist mit s: les livres."
      - type: language-task
        id: artikel-uebersetzen
        languages: { source: de, target: fr }
        task: Schreibe das französische Wort mit seinem Artikel.
        items:
          - source: das Heft
            target: le cahier
          - source: die Tür
            target: la porte
            mistakes:
              - answer: le porte
                message: "porte ist weiblich: la porte."
          - source: die Schule
            target: l'école
            mistakes:
              - answer: la école
                message: "Vor einem Vokal wird la zu l': l'école."
          - source: die Bücher
            target: les livres
