# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das Verb être
description: "Mit être sagst du, wer du bist, wer etwas ist und wo jemand ist: je suis, tu es, c'est, il est."
competencies: [verb-etre]
blocks:
  - type: section
    id: einstieg
    title: Worum es geht
    blocks:
      - type: figure
        image: images/szene-etre.svg
        alt: Léa (links, rote Jacke) und Malik (rechts, blaue Jacke, Brille) stehen neben einem großen Foto an der Wand. Auf dem Foto sind die beiden und eine Katze zu sehen.
        caption: Léa (links) zeigt Malik (rechts) ein Foto von ihnen beiden und der Katze. Findest du die Katze?
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: |
          Auf der Seite „Wer macht was?“ hast du die Pronomen gelernt. Jetzt brauchen sie ein Wort, das mit ihnen zusammenarbeitet.
          Léa zeigt Malik ein Foto und sagt, wer darauf ist und wo alle sind. Dafür braucht sie das wichtigste Wort überhaupt: *être*, auf Deutsch „sein“.

          **Danach kannst du:** *être* mit allen Pronomen verwenden und mit *c'est* und *il est* sagen, wer oder was etwas ist und wo jemand ist.
  - type: section
    id: neu
    title: "Neu: So lautet être"
    blocks:
      - type: definition
        term: Verb
        explanation: Ein Verb sagt, was jemand tut oder ist, zum Beispiel „spielen“ oder „sein“. Es verändert sich mit dem Pronomen.
      - type: table
        caption: être („sein“)
        header: [Pronomen, Form]
        rows:
          - ["je", "suis"]
          - ["tu", "es"]
          - ["il / elle / on", "est"]
          - ["nous", "sommes"]
          - ["vous", "êtes"]
          - ["ils / elles", "sont"]
      - type: text
        text: |
          Zwei kleine Wörter helfen dir auf dem Foto, wenn du etwas sagen willst:

          - **c'est** stellt etwas vor: *C'est Léa.* (Das ist Léa.) *C'est le chat.* (Das ist die Katze.)
          - **il est / elle est** sagt etwas über jemanden, zum Beispiel wo er oder sie ist: *Elle est ici.* (Sie ist hier.) *Il est à l'école.* (Er ist in der Schule.)

          Du kannst es dir so merken: Erst zeigst du mit *c'est* auf jemanden, dann sagst du mit *il est* oder *elle est* mehr über ihn oder sie.
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              Lerne jede Form mit dem Pronomen davor: *je suis*, *tu es*, *il est*. Zu *nous* gehört *sommes*, zu *vous* gehört *êtes*,
              zu *ils* und *elles* gehört *sont*.
  - type: section
    id: kurz-geuebt
    title: Kurz geübt
    blocks:
      - type: single-choice
        id: katze-vorstellen
        text: Léa zeigt auf die Katze auf dem Foto. Was sagt sie?
        options:
          - {
              text: "C'est le chat.",
              correct: true,
              info: "Richtig: Mit c'est stellst du jemanden oder etwas vor. „Das ist die Katze.“",
            }
          - {
              text: "Il est le chat.",
              correct: false,
              info: "il est sagst du, um mehr über jemanden zu sagen, zum Beispiel wo er ist. Zum Vorstellen nimmst du c'est.",
            }
          - { text: "Je suis le chat.", correct: false, info: "Je suis heißt „ich bin“. Léa ist aber nicht die Katze!" }
          - {
              text: "Nous sommes le chat.",
              correct: false,
              info: "Nous sommes heißt „wir sind“. Die Katze ist nur eine.",
            }
        explanation: "Zum Vorstellen sagst du c'est: C'est le chat."
        links:
          - { title: Französische Grammatik (Wikipedia), url: "https://de.wikipedia.org/wiki/Französische_Grammatik" }
  - type: section
    id: nachsprechen
    title: Hören und nachsprechen
    blocks:
      - type: text
        text: |
          Léa sagt *Je suis Léa.* und *Nous sommes à l'école.*, Malik sagt *Tu es Malik, oui.* („oui“ heißt „ja“) und *C'est le chat.*
          Höre zu, nimm dich selbst auf und vergleiche. Dann bewertest du dich selbst.
      - type: speaking-task
        id: sprechen-ueben
        language: fr
        items:
          - audio: je-suis-lea.mp3
            text: Je suis Léa.
          - audio: tu-es-malik-oui.mp3
            text: Tu es Malik, oui.
          - audio: cest-le-chat.mp3
            text: C'est le chat.
          - audio: nous-sommes-a-lecole.mp3
            text: Nous sommes à l'école.
        hint: "Sprich die Formen von être langsam und deutlich nach."
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: matching
        id: formen-zuordnen
        text: Welche Form von être gehört zu welchem Pronomen?
        pairs:
          - { left: je, right: suis }
          - { left: tu, right: es }
          - { left: on, right: est }
          - { left: vous, right: êtes }
          - { left: ils, right: sont }
        distractors: [sommes]
        explanation: "je suis, tu es, on est, vous êtes, ils sont. Die Form sommes gehört zu nous."
        links:
          - { title: Französische Grammatik (Wikipedia), url: "https://de.wikipedia.org/wiki/Französische_Grammatik" }
      - type: language-task
        id: etre-formen
        languages: { source: de, target: fr }
        mode: table
        task: Schreibe die fehlenden Formen von être.
        form: { case: hint }
        table:
          caption: être
          header: [Pronomen, Form]
          rows:
            - [je, "[suis]"]
            - [tu, "[es]"]
            - [il / elle, "[est]"]
            - [nous, "[sommes]"]
            - [vous, "[êtes]"]
            - [ils / elles, "[sont]"]
      - type: language-task
        id: etre-waehlen
        languages: { source: de, target: fr }
        mode: choice
        task: Wähle die passende Form von être.
        items:
          - source: Ich bin Léa.
            target: "Je [suis] Léa."
            distractors: [[es, est]]
            mistakes:
              - answer: es
                message: "es gehört zu tu („du bist“). Zu je gehört suis: je suis."
              - answer: est
                message: "est gehört zu il, elle und on. Zu je gehört suis: je suis."
          - source: Seid ihr hier?
            target: "Vous [êtes] ici ?"
            distractors: [[sommes, sont]]
            mistakes:
              - answer: sommes
                message: "sommes gehört zu nous („wir sind“). Zu vous gehört êtes: vous êtes."
              - answer: sont
                message: "sont gehört zu ils und elles („sie sind“). Zu vous gehört êtes: vous êtes."
          - source: Sie sind hier.
            target: "Ils [sont] ici."
            distractors: [[est, êtes]]
            mistakes:
              - answer: est
                message: "est gehört zu einer Person (il, elle). Bei mehreren sagst du sont: ils sont."
              - answer: êtes
                message: "êtes gehört zu vous („ihr seid“). Zu ils gehört sont: ils sont."
          - source: Wir sind hier.
            target: "On [est] ici."
            distractors: [[sont, es]]
            mistakes:
              - answer: sont
                message: "sont gehört zu ils und elles. Zu on gehört est: on est."
              - answer: es
                message: "es gehört zu tu. Zu on gehört est: on est."
      - type: language-task
        id: cest-oder-il-est
        languages: { source: de, target: fr }
        mode: choice
        task: c'est oder il est / elle est? Wähle das passende Wort.
        items:
          - source: Das ist Léa.
            target: "[C'est] Léa."
            distractors: [["Elle est", "Il est"]]
            mistakes:
              - answer: Elle est
                message: "Hier stellst du Léa vor („Das ist Léa“). Zum Vorstellen nimmst du c'est."
              - answer: Il est
                message: "Hier stellst du Léa vor („Das ist Léa“). Zum Vorstellen nimmst du c'est."
          - source: Sie ist hier. (Léa)
            target: "[Elle est] ici."
            distractors: [["C'est", "Il est"]]
            mistakes:
              - answer: "C'est"
                message: "Du sagst, wo Léa ist, nicht wer sie ist. Dafür nimmst du elle est."
              - answer: Il est
                message: "Léa ist ein Mädchen: Dafür nimmst du elle est."
          - source: Das ist der Ball.
            target: "[C'est] le ballon."
            distractors: [["Il est", "Elle est"]]
            mistakes:
              - answer: Il est
                message: "Du stellst den Ball vor („Das ist der Ball“). Zum Vorstellen nimmst du c'est."
              - answer: Elle est
                message: "Du stellst den Ball vor („Das ist der Ball“). Zum Vorstellen nimmst du c'est."
          - source: Er ist in der Schule. (Malik)
            target: "[Il est] à l'école."
            distractors: [["C'est", "Elle est"]]
            mistakes:
              - answer: "C'est"
                message: "Du sagst, wo Malik ist, nicht wer er ist. Dafür nimmst du il est."
              - answer: Elle est
                message: "Malik ist ein Junge: Dafür nimmst du il est."
      - type: language-task
        id: etre-hoeren
        languages: { source: de, target: fr }
        task: Höre den Satz und schreibe ihn auf. Du kannst ihn so oft hören, wie du magst.
        form: { case: hint, punctuation: ok }
        items:
          - audio: je-suis-malik.mp3
            target: Je suis Malik.
            mistakes:
              - answer: (J|j)e es Malik(.|)
                message: "Zu je gehört suis: je suis."
          - audio: il-est-ici.mp3
            target: Il est ici.
            mistakes:
              - answer: (I|i)l es ici(.|)
                message: "Zu il gehört est: il est."
          - audio: ils-sont-a-lecole.mp3
            target: Ils sont à l'école.
            mistakes:
              - answer: (I|i)ls est à l'école(.|)
                message: "Bei mehreren sagst du sont: ils sont."
      - type: language-task
        id: etre-uebersetzen
        languages: { source: de, target: fr }
        task: Schreibe den Satz auf Französisch.
        form: { case: hint, punctuation: ok }
        items:
          - source: Ich bin Léa.
            target: Je suis Léa.
            mistakes:
              - answer: (J|j)e es Léa(.|)
                message: "Zu je gehört suis: je suis."
          - source: Du bist hier.
            target: Tu es ici.
            mistakes:
              - answer: (T|t)u suis ici(.|)
                message: "Zu tu gehört es: tu es."
          - source: Das ist Malik.
            target: C'est Malik.
            mistakes:
              - answer: (I|i)l est Malik(.|)
                message: "Zum Vorstellen sagst du c'est: C'est Malik."
