# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Laut und Schrift
description: Fünf Buchstabenverbindungen im Französischen richtig aussprechen und erkennen.
competencies: [laut-und-schrift]
blocks:
  - type: section
    id: einstieg
    title: Worum es geht
    blocks:
      - type: figure
        image: images/szene-laut-und-schrift.svg
        alt: Léa (links, rote Jacke) und Malik (rechts, blaue Jacke, Brille) stehen vor dem Schulhaus. Über der Tür hängt ein Schild mit dem Wort ÉCOLE.
        caption: Léa (links) zeigt Malik (rechts) die Schule. Auf dem Schild steht ÉCOLE. Das heißt „Schule“.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: |
          Malik ist neu in Léas Klasse. Auf dem Schulhof hört er viele französische Wörter und möchte sie richtig sagen.
          Dabei hilft ihm ein Trick: Manche Buchstaben klingen zusammen anders als einzeln.

          **Danach kannst du:** fünf häufige Buchstabenverbindungen richtig aussprechen und im Wort erkennen: *ou*, *oi*,
          *au / eau*, *ch* und *gn*. Das ist die erste Seite. Du brauchst noch nichts vorher.
  - type: section
    id: neu
    title: "Neu: Buchstaben, die zusammen klingen"
    blocks:
      - type: text
        text: |
          Eine **Buchstabenverbindung** sind zwei oder drei Buchstaben, die zusammen einen einzigen Laut ergeben. Ein Laut
          ist das, was man hört. Im Französischen klingen manche Verbindungen anders, als du es vom Deutschen gewohnt bist.
      - type: table
        caption: So klingen die fünf Buchstabenverbindungen
        header: [Buchstaben, Klingt wie]
        rows:
          - ["ou", "langes „u“ wie in „Mut“"]
          - ["oi", "„ua“, schnell gesprochen"]
          - ["au, eau", "„o“ wie in „Boot“"]
          - ["ch", "„sch“ wie in „Schule“"]
          - ["gn", "„nj“ wie in „Anja“"]
      - type: text
        text: Hier siehst du zu jeder Verbindung zwei Wörter, die du gleich hörst und nachsprichst.
      - type: table
        caption: Beispielwörter mit ihrer Bedeutung
        header: [Buchstaben, Wort, Bedeutung]
        rows:
          - ["ou", "nous", "wir"]
          - ["ou", "rouge", "rot"]
          - ["oi", "moi", "ich, mich"]
          - ["oi", "noir", "schwarz"]
          - ["eau", "beau", "schön"]
          - ["eau", "bureau", "das Büro"]
          - ["ch", "chat", "die Katze"]
          - ["ch", "chocolat", "die Schokolade"]
          - ["gn", "montagne", "der Berg"]
          - ["gn", "campagne", "das Land (nicht Stadt)"]
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              *ou* sind nicht „o“ und „u“ nacheinander, sondern ein einziger Laut. *ch* klingt wie das deutsche „sch“,
              nicht wie „k“. Am Ende eines Wortes hört man oft den letzten Buchstaben nicht: *chat* klingt wie „scha“.
  - type: section
    id: nachsprechen
    title: Hören und nachsprechen
    blocks:
      - type: text
        text: |
          Léa spricht *rouge*, *beau* und *montagne* vor, Malik *moi* und *chat*. Höre zu, nimm dich selbst auf und vergleiche.
          Bewerte danach, wie es klang. Hör jedes Wort so oft, wie du magst.
      - type: speaking-task
        id: sprechen-ueben
        language: fr
        items:
          - audio: rouge.mp3
            text: rouge
          - audio: moi.mp3
            text: moi
          - audio: beau.mp3
            text: beau
          - audio: chat.mp3
            text: chat
          - audio: montagne.mp3
            text: montagne
        hint: "Sprich langsam. Bei *ou* bleiben die Lippen rund wie bei „u“."
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: matching
        id: klang-zuordnen
        text: Ordne jeder Buchstabenverbindung ihren Klang zu.
        pairs:
          - { left: ou, right: "langes „u“ (Mut)" }
          - { left: oi, right: "„ua“ (schnell)" }
          - { left: "au, eau", right: "„o“ (Boot)" }
          - { left: ch, right: "„sch“ (Schule)" }
          - { left: gn, right: "„nj“ (Anja)" }
        distractors: ["„k“ (Kuh)"]
        explanation: "ou klingt wie ein langes „u“, oi wie „ua“ (schnell gesprochen), au und eau wie „o“, ch wie „sch“ und gn wie „nj“."
        links:
          - { title: Französische Sprache (Wikipedia), url: "https://de.wikipedia.org/wiki/Französische_Sprache" }
      - type: language-task
        id: buchstaben-waehlen
        languages: { source: de, target: fr }
        mode: choice
        task: Wähle die Buchstaben, die in die Lücke gehören.
        items:
          - source: rot
            target: "r[ou]ge"
            distractors: [[oi, ch]]
          - source: schwarz
            target: "n[oi]r"
            distractors: [[ou, gn]]
          - source: Katze
            target: "[ch]at"
            distractors: [[gn, ou]]
          - source: Berg
            target: "monta[gn]e"
            distractors: [[ch, oi]]
      - type: language-task
        id: wort-hoeren
        languages: { source: de, target: fr }
        task: Höre das Wort und schreibe es auf. Du kannst es so oft hören, wie du magst.
        form: { case: hint, punctuation: ok }
        items:
          - audio: nous.mp3
            target: nous
            mistakes:
              - answer: nu
                message: "Der Laut ist ein langes „u“, aber man schreibt ihn *ou*: nous."
          - audio: noir.mp3
            target: noir
            mistakes:
              - answer: nuar
                message: "„ua“ (schnell) schreibt man *oi*: noir."
          - audio: bureau.mp3
            target: bureau
            mistakes:
              - answer: buro
                message: "Der Laut „o“ am Ende schreibt man *eau*: bureau."
          - audio: chocolat.mp3
            target: chocolat
            mistakes:
              - answer: schocolat
                message: "„sch“ schreibt man im Französischen *ch*: chocolat."
          - audio: campagne.mp3
            target: campagne
            mistakes:
              - answer: campanje
                message: "„nj“ schreibt man *gn*: campagne."
      - type: language-task
        id: woerter-uebersetzen
        languages: { source: de, target: fr }
        task: Schreibe das französische Wort ohne Artikel (ohne „der“, „die“, „das“).
        items:
          - source: die Katze
            target: chat
            mistakes:
              - answer: schat
                message: "„sch“ schreibt man *ch*: chat."
          - source: wir
            target: nous
          - source: schön
            target: beau
            mistakes:
              - answer: bo
                message: "Der Laut „o“ schreibt man hier *eau*: beau."
          - source: das Büro
            target: bureau
