# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Laut und Schrift
description: Fünf Buchstabenverbindungen im Französischen richtig aussprechen und erkennen.
competencies: [laut-und-schrift]
blocks:
  - type: section
    id: einstieg
    title: Worum es geht
    blocks:
      - type: figure
        image: images/szene-laut-und-schrift.svg
        alt: Léa (links, rote Jacke) und Malik (rechts, blaue Jacke, Brille) stehen vor dem Schulhaus. Über der Tür hängt ein Schild mit dem Wort ÉCOLE.
        caption: Léa (links) zeigt Malik (rechts) die Schule. Auf dem Schild steht ÉCOLE. Das heißt „Schule“.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: |
          Malik ist neu in Léas Klasse. Auf dem Schulhof hört er viele französische Wörter und möchte sie richtig sagen.
          Dabei hilft ihm ein Trick: Manche Buchstaben klingen zusammen anders als einzeln.

          **Danach kannst du:** fünf häufige Buchstabenverbindungen richtig aussprechen und im Wort erkennen: *ou*, *oi*,
          *au / eau*, *ch* und *gn*. Das ist die erste Seite. Du brauchst noch nichts vorher.
  - type: section
    id: neu
    title: "Neu: Buchstaben, die zusammen klingen"
    blocks:
      - type: text
        text: |
          Eine **Buchstabenverbindung** sind zwei oder drei Buchstaben, die zusammen einen einzigen Laut ergeben. Ein Laut
          ist das, was man hört. Im Französischen klingen manche Verbindungen anders, als du es vom Deutschen gewohnt bist.
      - type: table
        caption: So klingen die fünf Buchstabenverbindungen
        header: [Buchstaben, Klingt wie]
        rows:
          - ["ou", "langes „u“ wie in „Mut“"]
          - ["oi", "„ua“, schnell gesprochen"]
          - ["au, eau", "„o“ wie in „Boot“"]
          - ["ch", "„sch“ wie in „Schule“"]
          - ["gn", "„nj“ wie in „Anja“"]
      - type: text
        text: |
          Hier siehst du zu jeder Verbindung zwei Wörter, die du gleich hörst und nachsprichst. Das kleine Wort davor
          (*le*, *la*) gehört dazu: Merke dir jedes Wort gleich mit ihm. Was *le* und *la* genau sind, lernst du auf Seite 6.
      - type: table
        caption: Beispielwörter mit ihrer Bedeutung
        header: [Laut, Wort, Bedeutung]
        rows:
          - ["ou", "le jour", "der Tag"]
          - ["ou", "la route", "die Straße"]
          - ["oi", "le soir", "der Abend"]
          - ["oi", "la voiture", "das Auto"]
          - ["eau", "le bureau", "das Büro"]
          - ["eau", "le gâteau", "der Kuchen"]
          - ["ch", "le chat", "die Katze"]
          - ["ch", "le chocolat", "die Schokolade"]
          - ["gn", "la montagne", "der Berg"]
          - ["gn", "la campagne", "das Land"]
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              *ou* sind nicht „o“ und „u“ nacheinander, sondern ein einziger Laut. *ch* klingt wie das deutsche „sch“,
              nicht wie „k“. Am Ende eines Wortes hört man oft den letzten Buchstaben nicht: *le chat* klingt wie „le scha“.
  - type: section
    id: nachsprechen
    title: Hören und nachsprechen
    blocks:
      - type: text
        text: |
          Zuerst einzelne Wörter: Léa spricht *le jour*, *le gâteau* und *la montagne* vor, Malik *le soir* und *le chat*.
          Höre zu, nimm dich selbst auf und vergleiche. Bewerte danach, wie es klang. Hör jedes Wort so oft, wie du magst.
      - type: speaking-task
        id: sprechen-ueben
        language: fr
        items:
          - audio: le-jour.mp3
            text: le jour
          - audio: le-soir.mp3
            text: le soir
          - audio: le-gateau.mp3
            text: le gâteau
          - audio: le-chat.mp3
            text: le chat
          - audio: la-montagne.mp3
            text: la montagne
        hint: "Sprich langsam. Bei *ou* bleiben die Lippen rund wie bei „u“."
      - type: text
        text: |
          Jetzt zwei kurze Sätze. Ein Satz klingt leichter, weil die Wörter ineinander übergehen. *Voici* heißt „hier ist“:
          *Voici le chat.* sagt Malik, *Voici la montagne.* sagt Léa.
      - type: speaking-task
        id: sprechen-satz
        language: fr
        items:
          - audio: voici-le-chat.mp3
            text: Voici le chat.
          - audio: voici-la-montagne.mp3
            text: Voici la montagne.
        hint: "Sprich den ganzen Satz in einem Zug, ohne zwischen den Wörtern abzusetzen."
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: matching
        id: klang-zuordnen
        text: Ordne jeder Buchstabenverbindung ihren Klang zu.
        pairs:
          - { left: ou, right: "langes „u“ (Mut)" }
          - { left: oi, right: "„ua“ (schnell)" }
          - { left: "au, eau", right: "„o“ (Boot)" }
          - { left: ch, right: "„sch“ (Schule)" }
          - { left: gn, right: "„nj“ (Anja)" }
        distractors: ["„k“ (Kuh)"]
        explanation: "ou klingt wie ein langes „u“, oi wie „ua“ (schnell gesprochen), au und eau wie „o“, ch wie „sch“ und gn wie „nj“."
        links:
          - { title: Französische Sprache (Wikipedia), url: "https://de.wikipedia.org/wiki/Französische_Sprache" }
      - type: language-task
        id: buchstaben-waehlen
        languages: { source: de, target: fr }
        mode: choice
        task: Wähle die Buchstaben, die in die Lücke gehören.
        items:
          - source: die Straße
            target: "la r[ou]te"
            distractors: [[oi, ch]]
          - source: der Abend
            target: "le s[oi]r"
            distractors: [[ou, gn]]
          - source: die Katze
            target: "le [ch]at"
            distractors: [[gn, ou]]
          - source: der Berg
            target: "la monta[gn]e"
            distractors: [[ch, oi]]
      - type: language-task
        id: wort-hoeren
        languages: { source: de, target: fr }
        task: Höre das Wort und schreibe es auf. Du kannst es so oft hören, wie du magst.
        form: { case: hint, punctuation: ok }
        items:
          - audio: la-route.mp3
            target: la route
            mistakes:
              - answer: la rute
                message: "Der Laut „u“ schreibt man hier *ou*: la route."
          - audio: la-voiture.mp3
            target: la voiture
            mistakes:
              - answer: la vuatur
                message: "„ua“ (schnell) schreibt man *oi*: la voiture."
          - audio: le-bureau.mp3
            target: le bureau
            mistakes:
              - answer: le buro
                message: "Der Laut „o“ am Ende schreibt man *eau*: le bureau."
          - audio: le-chocolat.mp3
            target: le chocolat
            mistakes:
              - answer: le schocolat
                message: "„sch“ schreibt man im Französischen *ch*: le chocolat."
          - audio: la-campagne.mp3
            target: la campagne
            mistakes:
              - answer: la campanje
                message: "„nj“ schreibt man *gn*: la campagne."
      - type: language-task
        id: woerter-uebersetzen
        languages: { source: de, target: fr }
        task: Schreibe das französische Wort mit seinem kleinen Wort davor (le oder la).
        items:
          - source: die Katze
            target: le chat
            mistakes:
              - answer: chat
                message: "Das kleine Wort gehört dazu: le chat."
              - answer: le schat
                message: "„sch“ schreibt man *ch*: le chat."
          - source: der Abend
            target: le soir
            mistakes:
              - answer: le suar
                message: "„ua“ (schnell) schreibt man *oi*: le soir."
          - source: das Büro
            target: le bureau
          - source: der Kuchen
            target: le gâteau
            mistakes:
              - answer: le gato
                message: "Der Laut „o“ am Ende schreibt man *eau*: le gâteau."
