subject: franzoesisch
title: "Bonjour, Léa und Malik!"
intro: |
  Léa und Malik gehen in dieselbe Klasse. Malik ist neu, und Léa zeigt ihm die Schule, den Fußballplatz und ihr Zimmer.
  Du hörst ihnen zu, sprichst nach und knackst Schritt für Schritt die ersten Geheimnisse des Französischen.

  **[Los geht's: Seite 1, Laut und Schrift](/kapitel-1/laut-und-schrift/)**

  Léa und Malik sprechen mit Computerstimmen (das heißt „KI“ am Player). Zum Nachsprechen brauchst du ein Mikrofon, sonst hörst du einfach zu.
