format: 2
subject: franzoesisch
title: "Bonjour, Léa und Malik!"
intro: |
  Léa und Malik gehen in dieselbe Klasse. Malik ist neu, und Léa zeigt ihm die Schule, den Fußballplatz und ihr Zimmer.
  Du hörst ihnen zu, sprichst nach und übst die ersten Wörter und Regeln im Französischen.
languages: [de]
chapters: [kapitel-1]
