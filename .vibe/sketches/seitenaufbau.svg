<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="sans-serif" font-size="14">
  <title>Aufbau einer Seite (Skizze, 360 px breit)</title>
  <rect width="760" height="640" fill="#fff"/>
  <text x="20" y="28" font-size="18" font-weight="bold">Seite 1 „Laut und Schrift“ – Aufbau von oben nach unten</text>
  <rect x="20" y="44" width="360" height="580" rx="10" fill="#f6f6f2" stroke="#444"/>
  <rect x="32" y="56" width="336" height="34" rx="6" fill="#dfe8f5" stroke="#557"/><text x="44" y="78">Bonjour, Léa und Malik! · Seite 1 von 7</text>
  <rect x="32" y="100" width="336" height="58" rx="6" fill="#fff" stroke="#999"/><text x="44" y="122">Ziel: Danach kannst du ou, oi, eau, ch</text><text x="44" y="142">und gn richtig aussprechen.</text>
  <rect x="32" y="168" width="336" height="110" rx="6" fill="#fdf1d8" stroke="#a80"/><text x="44" y="192">[Bild: Léa zeigt Malik das Schild</text><text x="44" y="212">„Bienvenue à l'école“ am Schultor]</text><text x="44" y="262" font-size="12">Bildunterschrift + Alternativtext</text>
  <rect x="32" y="288" width="336" height="124" rx="6" fill="#fff" stroke="#999"/><text x="44" y="310" font-weight="bold">Neu: Buchstaben, die zusammen klingen</text>
  <text x="44" y="334">Tabelle: ou · oi · eau · ch · gn</text><text x="44" y="354">je mit Beispielwort und Bedeutung</text><text x="44" y="374">Hinweis: so liest man es NICHT wie im Deutschen</text>
  <rect x="32" y="422" width="336" height="76" rx="6" fill="#e6f4e6" stroke="#4a4"/><text x="44" y="444" font-weight="bold">Hören und Nachsprechen</text><text x="44" y="466">▶ Vorbild   ● Aufnahme   ▶ Vergleich</text><text x="44" y="486">Selbsteinschätzung: gut / noch üben</text>
  <rect x="32" y="508" width="336" height="104" rx="6" fill="#fff" stroke="#999"/><text x="44" y="530" font-weight="bold">Übung (leicht → schwer)</text>
  <text x="44" y="552">1 auswählen · 2 Lücke füllen</text><text x="44" y="572">3 Wort hören und schreiben</text><text x="44" y="592">Falsche Antwort: sagt, welche Regel fehlt</text>
  <text x="410" y="70" font-weight="bold">Feste Abschnitte (Ids): einstieg · neu · nachsprechen · uebung</text>
  <text x="410" y="100">• Jede Seite: gleiche Reihenfolge, gleiche Ids.</text>
  <text x="410" y="124">• Ein Abschnitt, den eine Seite nicht braucht,</text><text x="426" y="144">fällt weg (Seite 3 hat „neu“ als Zahlenreihe).</text>
  <text x="410" y="176">• Alle Texte deutsch, Beispiele französisch.</text>
  <text x="410" y="200">• Bilder gezeichnet, nie Fotos; alt-Text immer.</text>
  <text x="410" y="224">• Ton: nur nach Klick; Player mit Tempo 0,75.</text>
  <text x="410" y="260" font-weight="bold">Was Kinder tun</text><text x="410" y="284">1 Szene ansehen, Ziel lesen</text><text x="410" y="304">2 Beispiele hören, Neues lesen</text><text x="410" y="324">3 nachsprechen, sich selbst bewerten</text><text x="410" y="344">4 üben und Rückmeldung lesen</text>
</svg>
