<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" role="img" aria-labelledby="t d">
<title id="t">Skizze: Sprechaufgabe Nachsprechen</title>
<desc id="d">Schritte: 1 Original hören, 2 aufnehmen, 3 Aufnahme und Original vergleichen, 4 sich selbst bewerten.</desc>
<style>text{font:14px sans-serif;fill:#222}rect{fill:#f4f4f4;stroke:#888}</style>
<rect x="8" y="8" width="344" height="224"/>
<text x="20" y="34">Sag nach: «Il est huit heures.»  [KI]</text>
<text x="20" y="66">1 ▶ Original anhören (0,75× · 1× · 1,25×)</text>
<text x="20" y="98">2 ● Aufnahme starten  ■ stoppen</text>
<text x="20" y="130">3 ▶ meine Aufnahme  ▶ beides nacheinander</text>
<text x="20" y="162">4 Wie klang es? (er)kennbar · fast · noch üben</text>
<text x="20" y="200">Nichts wird gespeichert oder gesendet.</text>
</svg>
